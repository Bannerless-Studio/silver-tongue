name: publish
# Publishes packages/tui-node to npm as `silver-tongue` when a merge lands on main.
# Skips cleanly when that version is already on npm, so only a version bump publishes.
# Needs the repository secret NPM_TOKEN (an npm automation or granular token with publish rights).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already published
        id: version
        run: |
          VERSION=$(node -p "require('./packages/tui-node/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "silver-tongue@$VERSION" version >/dev/null 2>&1; then
            echo "silver-tongue@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.version.outputs.publish == 'true'
        run: npm run build:course
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm run bundle -w silver-tongue

      - name: Publish silver-tongue@${{ steps.version.outputs.version }}
        if: steps.version.outputs.publish == 'true'
        run: npm publish -w silver-tongue --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
