name: ci
on: [push, pull_request]
permissions:
  contents: read
  packages: read # the private @bannerless-studio/silver-tongue-core
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - name: Make missing audio clips (lab experiments change lines; clips are not committed yet)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pipx install edge-tts
          npm run audio -- ko-seoul
      - run: npm run build:course
      - name: goal 3 report (job summary; missed limits as warnings, never a failure)
        run: npm run report:goal3
        continue-on-error: true
      - run: npm test
      - run: npm run build:web
      - run: npm run build:vn
