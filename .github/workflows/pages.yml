name: pages
# Builds the site (the visual novel at /, the text game at /text/, the quiet terminal at /quiet/) and deploys it to GitHub Pages on every push to main.
# Also builds the branch `lab` (when it exists) and serves it under /lab/, rebuilt on every push to main or lab.
# Needs Pages turned on for the repository with "GitHub Actions" as the source.

on:
  push:
    branches: [main, lab, lab-inner-voice]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the private @bannerless-studio/silver-tongue-core
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Make missing audio clips (lab experiments change lines; clips are not committed yet)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pipx install edge-tts
          npm run audio -- ko-seoul
      - run: npm run build:course
      - run: npm run build:site
      - name: Look for the lab branch
        id: lab
        run: |
          if git ls-remote --exit-code --heads origin lab > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.lab.outputs.exists == 'true'
        with:
          ref: lab
          path: lab-src
      - name: Build the lab branch into site/lab/
        if: steps.lab.outputs.exists == 'true'
        working-directory: lab-src
        run: |
          npm ci
          npm run build:course
          npm run build:site
          mkdir -p ../site/lab
          cp -R site/. ../site/lab/
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
