name: pages
# Builds the site (the visual novel at /, the text game at /text/, the 3D street at /world3d/)
# and deploys it to GitHub Pages on every push to main. Every world3d URL is relative, so a
# fork's <user>.github.io/silver-tongue/world3d/ works too. world3d's GLBs are vendored in
# packages/world3d/assets: no external asset library.
# world3d loads its audio clips from ../courses/<course>/audio/, the site's shared courses folder (build:site).
# Needs Pages turned on for the repository with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:course
      - run: npm run build:site
      - run: npm run build -w @silver-tongue/world3d
      - name: Add world3d to the site (at /world3d/)
        run: |
          mkdir -p site/world3d
          cp -R packages/world3d/dist/. site/world3d/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
