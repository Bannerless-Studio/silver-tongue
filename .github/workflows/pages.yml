name: pages
# Builds the site (the visual novel at /, the text game at /text/) and deploys it to GitHub Pages on every push to main.
# Needs Pages turned on for the repository with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the private @bannerless-studio/silver-tongue-core
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build:course
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
